name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/*.png"
      - "icons/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The page reuses the README screenshots and the extension icons, so they live in one place.
      - name: Assemble site
        run: |
          mkdir -p _site/img
          cp site/index.html site/sitemap.xml _site/
          cp docs/popup.png docs/rules.png docs/editor.png docs/social-preview.png _site/img/
          cp icons/logo.svg icons/icon-32.png icons/icon-128.png _site/img/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
