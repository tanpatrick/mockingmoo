name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: meta
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/mockingmoo-${{ steps.meta.outputs.version }}.zip" \
            manifest.json bridge.js inject.js shared.js \
            popup.html popup.js options.html options.js styles.css \
            icons vendor \
            -x "*.DS_Store"

      - uses: actions/upload-artifact@v4
        with:
          name: mockingmoo-${{ steps.meta.outputs.version }}
          path: dist/*.zip

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.needed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
