name: Build extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; the release step below asks for write access explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version comes from the repository, so it is untrusted input on pull requests.
      # It is only ever passed to the shell through environment variables, never through ${{ }}.
      - name: Read version from manifest
        id: meta
        run: |
          version="$(jq -r .version manifest.json)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "manifest.json version '$version' is not a plain dotted number" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package extension
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          zip -r "dist/mockingmoo-${VERSION}.zip" \
            manifest.json bridge.js inject.js shared.js \
            popup.html popup.js options.html options.js styles.css \
            icons vendor \
            -x "*.DS_Store"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mockingmoo-${{ steps.meta.outputs.version }}
          path: dist/*.zip

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read version from manifest
        id: meta
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.release.outputs.needed == 'true'
        with:
          name: mockingmoo-${{ steps.meta.outputs.version }}
          path: dist

      - name: Publish GitHub release
        if: steps.release.outputs.needed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
